<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" height="48">
  <!-- House silhouette -->
  <g transform="translate(4, 4)">
    <!-- Roof -->
    <polygon points="20,18 0,34 40,34" fill="#C8920A"/>
    <!-- Body -->
    <rect x="5" y="34" width="30" height="22" rx="1" fill="#C8920A"/>
    <!-- Door -->
    <rect x="15" y="42" width="10" height="14" rx="1" fill="#0B1F3A"/>
    <!-- Chimney -->
    <rect x="28" y="20" width="6" height="14" fill="#C8920A"/>
    <!-- Checkmark overlay -->
    <polyline points="10,38 17,45 32,28" fill="none" stroke="#0B1F3A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Text -->
  <text x="54" y="37" font-family="'Bodoni Moda','Georgia','Times New Roman',serif" font-size="30" font-weight="900" letter-spacing="-0.5">
    <tspan fill="#FFFFFF">Valu</tspan><tspan fill="#C8920A">Check</tspan>
  </text>
</svg>
